<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" width="560" height="370" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Weighting error estimates in a hypothetical audit</title><desc id="figure-desc">A hypothetical audit of 1,000 summaries: two reviewers disagreed on 100 and agreed on 900. A random audit of 20 in each group finds 8 errors and 1 error, respectively. Weighting the sample error rates, 40% and 5%, by the two groups’ sizes gives an estimated overall error rate of 8.5%.</desc><rect x="0" y="0" width="560" height="370" fill="#fff" stroke="none" stroke-width="1" /><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="29" font-size="15" font-weight="700" fill="#585858" text-anchor="start">HYPOTHETICAL AUDIT</text><text x="22" y="62" font-size="26" font-weight="700" fill="#252525" text-anchor="start">Weight each group by its size</text><text x="22" y="90" font-size="18" font-weight="400" fill="#414141" text-anchor="start">Equal audit samples do not make the groups equally common</text><rect x="22" y="114" width="51.6" height="23" fill="#946029" stroke="none" stroke-width="1" /><rect x="73.6" y="114" width="464.4" height="23" fill="#bcd0d8" stroke="none" stroke-width="1" /><text x="22" y="162" font-size="18" font-weight="700" fill="#946029" text-anchor="start">Disagreed: 100</text><text x="538" y="162" font-size="18" font-weight="700" fill="#25576b" text-anchor="end">Agreed: 900</text><line x1="22" y1="181" x2="538" y2="181" stroke="#b5b5b5" stroke-width="1" /><text x="22" y="205" font-size="15" font-weight="700" fill="#555" text-anchor="start">GROUP</text><text x="350" y="205" font-size="15" font-weight="700" fill="#555" text-anchor="end">AUDITED</text><text x="538" y="205" font-size="15" font-weight="700" fill="#555" text-anchor="end">EST. ERROR</text><text x="22" y="233" font-size="21" font-weight="600" fill="#946029" text-anchor="start">Disagreed</text><text x="350" y="233" font-size="21" font-weight="400" fill="#252525" text-anchor="end">8 of 20</text><text x="538" y="233" font-size="21" font-weight="600" fill="#252525" text-anchor="end">40%</text><text x="22" y="264" font-size="21" font-weight="600" fill="#25576b" text-anchor="start">Agreed</text><text x="350" y="264" font-size="21" font-weight="400" fill="#252525" text-anchor="end">1 of 20</text><text x="538" y="264" font-size="21" font-weight="600" fill="#252525" text-anchor="end">5%</text><line x1="22" y1="285" x2="538" y2="285" stroke="#999" stroke-width="1" /><text x="22" y="323" font-size="22" font-weight="600" fill="#252525" text-anchor="start">(10% × 40%) + (90% × 5%)</text><text x="538" y="323" font-size="31" font-weight="700" fill="#222" text-anchor="end">8.5%</text><text x="22" y="351" font-size="17" font-weight="400" fill="#505050" text-anchor="start">Weighted estimate for all 1,000 summaries</text></g></svg>
