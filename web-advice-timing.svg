<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 324" width="560" height="324" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Acceptance of the wrong ingredient recommendation</title><desc id="figure-desc">When the AI suggested removing the wrong ingredient, participants followed that suggestion in an estimated 64% of trials with immediate explanations and 48% with delayed or on-demand advice. Both estimates had a standard error of 3 percentage points.</desc><rect x="0" y="0" width="560" height="324" fill="#fff" stroke="none" stroke-width="1" /><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="29" font-size="15" font-weight="700" fill="#585858" text-anchor="start">EXPERIMENT  /  ADVICE TIMING</text><text x="22" y="62" font-size="26" font-weight="700" fill="#252525" text-anchor="start">Following a wrong suggestion</text><text x="22" y="90" font-size="18" font-weight="400" fill="#414141" text-anchor="start">Estimated share choosing the wrong ingredient suggested by AI</text><text x="25" y="125" font-size="20" font-weight="500" fill="#252525" text-anchor="start">Recommendation shown immediately</text><line x1="25" y1="141" x2="515" y2="141" stroke="#d6dadd" stroke-width="1.2" /><line x1="25" y1="141" x2="338.6" y2="141" stroke="#946029" stroke-width="3.25" /><line x1="323.9" y1="141" x2="353.3" y2="141" stroke="#946029" stroke-width="2" /><line x1="323.9" y1="134" x2="323.9" y2="148" stroke="#946029" stroke-width="2" /><line x1="353.3" y1="134" x2="353.3" y2="148" stroke="#946029" stroke-width="2" /><circle cx="338.6" cy="141" r="6.7" fill="#946029" stroke="none" stroke-width="1" /><text x="365.3" y="147" font-size="21" font-weight="700" fill="#946029" text-anchor="start">64%</text><text x="25" y="206" font-size="20" font-weight="500" fill="#252525" text-anchor="start">Recommendation delayed or requested</text><line x1="25" y1="222" x2="515" y2="222" stroke="#d6dadd" stroke-width="1.2" /><line x1="25" y1="222" x2="260.2" y2="222" stroke="#25576b" stroke-width="3.25" /><line x1="245.49999999999997" y1="222" x2="274.9" y2="222" stroke="#25576b" stroke-width="2" /><line x1="245.49999999999997" y1="215" x2="245.49999999999997" y2="229" stroke="#25576b" stroke-width="2" /><line x1="274.9" y1="215" x2="274.9" y2="229" stroke="#25576b" stroke-width="2" /><rect x="254.5" y="216.3" width="11.4" height="11.4" fill="#25576b" stroke="none" stroke-width="1" /><text x="286.9" y="228" font-size="21" font-weight="700" fill="#25576b" text-anchor="start">48%</text><line x1="25" y1="242" x2="25" y2="249" stroke="#737373" stroke-width="1.5" /><text x="25" y="272" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="middle">0%</text><line x1="147.5" y1="242" x2="147.5" y2="249" stroke="#737373" stroke-width="1.5" /><text x="147.5" y="272" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="middle">25%</text><line x1="270.0" y1="242" x2="270.0" y2="249" stroke="#737373" stroke-width="1.5" /><text x="270.0" y="272" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="middle">50%</text><line x1="392.5" y1="242" x2="392.5" y2="249" stroke="#737373" stroke-width="1.5" /><text x="392.5" y="272" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="middle">75%</text><line x1="515" y1="242" x2="515" y2="249" stroke="#737373" stroke-width="1.5" /><text x="515" y="272" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="middle">100%</text><line x1="25" y1="242" x2="515" y2="242" stroke="#828282" stroke-width="1" /><text x="25" y="306" font-size="16" font-weight="400" fill="#505050" text-anchor="start">Markers: adjusted estimates    Whiskers: ±1 standard error</text></g></svg>
