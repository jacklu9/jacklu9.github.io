<svg xmlns="http://www.w3.org/2000/svg" width="640" height="318" viewBox="0 0 640 318" role="img" aria-labelledby="title desc">
  <title id="title">Two station routes and one decisive closure</title>
  <desc id="desc">An upper dashed route connects the street to the platform via a footbridge with stairs. A lower solid route runs via an underpass and is blocked where its lift is closed. Neither of the two shown routes is step-free while the lift is closed.</desc>
  <rect width="640" height="318" fill="#fff"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#20282c">
    <text x="32" y="34" font-size="19" font-weight="650">Can the route be used without stairs?</text>
    <text x="608" y="34" text-anchor="end" font-size="15" fill="#49565c">Illustrative station</text>
    <path d="M32 52H608" stroke="#d7dcdf"/>
    <path d="M80 160H111L158 101H482L529 160H560" fill="none" stroke="#69767b" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>
    <path d="M80 160H111L158 220H461M499 196L529 160H560" fill="none" stroke="#25576b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M469 214L492 201" fill="none" stroke="#9d6a37" stroke-width="1.5" stroke-dasharray="2 4"/>
    <circle cx="80" cy="160" r="8" fill="#fff" stroke="#273339" stroke-width="2.5"/>
    <circle cx="560" cy="160" r="8" fill="#fff" stroke="#273339" stroke-width="2.5"/>
    <text x="80" y="139" text-anchor="middle" font-size="16" font-weight="600">Street</text>
    <text x="560" y="139" text-anchor="middle" font-size="16" font-weight="600">Platform</text>
    <text x="230" y="85" text-anchor="middle" font-size="19" font-weight="600">Footbridge</text>
    <text x="276" y="204" text-anchor="middle" font-size="19" font-weight="600" fill="#25576b">Underpass</text>
    <rect x="403" y="89" width="31" height="25" rx="3" fill="#fff"/>
    <path d="M406 109H412V103H418V98H425V92H430" fill="none" stroke="#58656a" stroke-width="2"/>
    <text x="419" y="135" text-anchor="middle" font-size="16" fill="#49565c">Stairs</text>
    <circle cx="481" cy="207" r="12" fill="#fff5e9" stroke="#946029" stroke-width="2"/>
    <path d="M477 203L485 211M485 203L477 211" stroke="#78491e" stroke-width="2.2" stroke-linecap="round"/>
    <text x="481" y="241" text-anchor="middle" font-size="17" font-weight="650" fill="#78491e">Lift closed</text>
    <path d="M32 265H608" stroke="#d7dcdf"/>
    <text x="32" y="294" font-size="19" font-weight="600">Neither route shown is currently step-free.</text>
  </g>
</svg>
