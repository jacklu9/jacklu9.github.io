<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 379" width="560" height="379" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">The same station warning at three points along a journey</title><desc id="figure-desc">A schematic follows a lift-out-of-service warning through three points along a station journey. In the route planner it may lead to a different station; at the entrance there may be time to turn back or ask; at the foot of the stairs it may only explain why the lift did not open.</desc><rect x="0" y="0" width="560" height="379" fill="#fff" stroke="none" stroke-width="1" /><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="29" font-size="15" font-weight="700" fill="#585858" text-anchor="start">STATION EXAMPLE  /  SCHEMATIC</text><text x="22" y="62" font-size="26" font-weight="700" fill="#252525" text-anchor="start">Where the warning arrives</text><text x="22" y="90" font-size="18" font-weight="400" fill="#414141" text-anchor="start">The fact stays the same. Its placement changes what is possible.</text><line x1="41" y1="147" x2="41" y2="203" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="3 5" /><circle cx="41" cy="131" r="15" fill="#fff" stroke="#25576b" stroke-width="1.65" /><text x="41" y="137" font-size="17" font-weight="700" fill="#25576b" text-anchor="middle">1</text><text x="72" y="131" font-size="22" font-weight="700" fill="#25576b" text-anchor="start">Route planner</text><text x="72" y="158" font-size="19" font-weight="400" fill="#3b3b3b" text-anchor="start">Choose a different station.</text><line x1="41" y1="219" x2="41" y2="275" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="3 5" /><circle cx="41" cy="203" r="15" fill="#fff" stroke="#3f515a" stroke-width="1.65" /><text x="41" y="209" font-size="17" font-weight="700" fill="#3f515a" text-anchor="middle">2</text><text x="72" y="203" font-size="22" font-weight="700" fill="#3f515a" text-anchor="start">Station entrance</text><text x="72" y="230" font-size="19" font-weight="400" fill="#3b3b3b" text-anchor="start">Turn back or ask about another route.</text><circle cx="41" cy="275" r="15" fill="#fff" stroke="#946029" stroke-width="1.65" /><text x="41" y="281" font-size="17" font-weight="700" fill="#946029" text-anchor="middle">3</text><text x="72" y="275" font-size="22" font-weight="700" fill="#946029" text-anchor="start">Bottom of the stairs</text><text x="72" y="302" font-size="19" font-weight="400" fill="#3b3b3b" text-anchor="start">The notice explains why the lift did not open.</text><line x1="22" y1="333" x2="538" y2="333" stroke="#b8b8b8" stroke-width="1" /><text x="22" y="359" font-size="17" font-weight="400" fill="#505050" text-anchor="start">Sequence only; positions do not represent elapsed time.</text></g></svg>
